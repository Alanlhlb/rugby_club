name: rugby_club
description: "Rugby Team Management App - Flutter + Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7

  # State Management
  provider: ^6.1.2

  # UI Components
  table_calendar: ^3.1.3

  # Utils
  intl: ^0.19.0
  http: ^1.2.0

  # Location & Media
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.0
  image_cropper: ^8.0.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
